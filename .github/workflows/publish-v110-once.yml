name: Publish v1.1.0 installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER_NAME: "空间都去哪了 Install v1.1.0.exe"
    steps:
      - name: Publish verified v1.1.0 installer
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          mkdir -p packages/v1.1.0
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/662818351" -H 'Accept: application/octet-stream' > "packages/v1.1.0/$INSTALLER_NAME"
          printf '%s  %s\n' '79cbd705166a564ec1b3fbb85f1b3946db48b4e919f60de6bf8b41f83bbe40e3' "packages/v1.1.0/$INSTALLER_NAME" | sha256sum --check -
          printf '%s' '' | base64 --decode > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md "packages/v1.1.0/$INSTALLER_NAME"
          git commit -m '发布 v1.1.0 安装包'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push origin main
