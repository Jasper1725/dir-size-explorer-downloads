name: Publish v1.1.1 installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER_NAME: "空间都去哪了 Install v1.1.1.exe"
    steps:
      - name: Publish verified installer
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e packages/v1.1.1
          mkdir -p packages/v1.1.1
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/672399905" -H 'Accept: application/octet-stream' > "packages/v1.1.1/$INSTALLER_NAME"
          printf '%s  %s\n' 'f57e0ba7484f9b9a0d540ca82b188549c92c4a68bcd5bf4d135d26e318fa278b' "packages/v1.1.1/$INSTALLER_NAME" | sha256sum --check -
          printf '%s' '' | base64 --decode > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md "packages/v1.1.1/$INSTALLER_NAME"
          git commit -m '发布 v1.1.1 安装包'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push origin main
